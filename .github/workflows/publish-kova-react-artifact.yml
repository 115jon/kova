name: Publish Kova React Artifact

on:
  # release-please.yml calls this after it creates a kova-react release.
  workflow_call:
    inputs:
      tag_name:
        description: Kova React release tag to package
        required: true
        type: string
  # Releases published by hand, or by a PAT.
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: Kova React release tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name || inputs.tag_name, 'kova-react-v')
    runs-on: ubuntu-latest
    # Serialize per tag. The upload uses --clobber, so a second run just
    # replaces the asset with an identical one.
    concurrency:
      group: publish-kova-react-artifact-${{ github.event.release.tag_name || inputs.tag_name }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Kova React dependencies
        run: pnpm install --frozen-lockfile --filter @115jon/kova-react...

      - name: Build Kova React package
        run: pnpm --filter @115jon/kova-react run build

      - name: Pack Kova React package
        id: package
        shell: bash
        run: |
          pnpm --filter @115jon/kova-react pack --pack-destination "$RUNNER_TEMP"
          package_version=$(node -p "require('./packages/kova-react/package.json').version")
          echo "asset=$RUNNER_TEMP/115jon-kova-react-${package_version}.tgz" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        run: gh release upload "$RELEASE_TAG" "${{ steps.package.outputs.asset }}" --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
