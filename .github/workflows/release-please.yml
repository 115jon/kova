name: Release Please

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/**"
      - "**/*.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Opening the release PR needs one of these two:
#   - Settings > Actions > General > Workflow permissions > "Allow GitHub
#     Actions to create and approve pull requests", or
#   - a RELEASE_TOKEN secret: a fine-grained PAT on this repo with Contents and
#     Pull requests set to read and write.
# Without either, the release-pr job fails with "GitHub Actions is not
# permitted to create or approve pull requests".

jobs:
  # Pass 1 only tags and releases a merged release PR. It runs separately from
  # the release PR update (pass 2), so a failure there can't hide a release that
  # was already created. That happened for v1.1.0: the release was created,
  # then a GraphQL error during the PR update failed the job.
  release:
    name: release
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs['packages/kova-react--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages/kova-react--tag_name'] }}
    steps:
      - name: Create GitHub release for a merged release PR
        id: release
        # googleapis/release-please-action v4.4.1
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          skip-github-pull-request: true

  # A release created with GITHUB_TOKEN does not fire `release: published`, so
  # publish runs here directly. With a RELEASE_TOKEN PAT the release event also
  # fires; both publish workflows are idempotent and serialized per tag, so
  # running twice is harmless.
  publish-package:
    name: publish package
    needs: release
    if: ${{ needs.release.outputs.created == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-kova-react-package.yml
    with:
      tag_name: ${{ needs.release.outputs.tag_name }}

  publish-artifact:
    name: publish artifact
    needs: release
    if: ${{ needs.release.outputs.created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-kova-react-artifact.yml
    with:
      tag_name: ${{ needs.release.outputs.tag_name }}

  release-pr:
    name: release-pr
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the release PR
        # googleapis/release-please-action v4.4.1
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          skip-github-release: true
