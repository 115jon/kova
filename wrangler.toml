# ─────────────────────────────────────────────────────────────────────────────
# wrangler.toml — THE single Cloudflare Worker config for kova-auth.
#
# Lives at the REPO ROOT so every command works without cd-ing into a subdir:
#
#   pnpm run dev        →  Vite + Cloudflare Worker dev server on :5174
#   pnpm run deploy     →  build + wrangler deploy    (runs from repo root)
#   pnpm run migrate:dev   →  local D1 migrations
#   pnpm run migrate:prod  →  prod D1 migrations (careful!)
#
# Worker source:  src/worker/index.ts   (Hono boundary + TanStack Start)
# Client assets:  generated by the Cloudflare Vite/TanStack Start plugins
# Migrations:     migrations/
# ─────────────────────────────────────────────────────────────────────────────

name = "ralph-auth-server"
main = "src/worker/index.ts"
compatibility_date = "2026-04-12"
compatibility_flags = ["nodejs_compat"]

# ── Static Assets ─────────────────────────────────────────────────────────────
# The Cloudflare Vite plugin writes the generated client directory into the
# deployment config. Keep the binding and worker-first routing here because the
# hosted-auth subsystem shares the deployment with the Start server.
[assets]
binding = "ASSETS"
run_worker_first = true

# ── Routes ────────────────────────────────────────────────────────────────────
[[routes]]
pattern = "auth.115jon.site"
zone_name = "115jon.site"
custom_domain = true

# Wildcard subdomain route — handles {slug}.auth.115jon.site for all registered apps.
[[routes]]
pattern = "*.auth.115jon.site/*"
zone_name = "115jon.site"

[vars]
CDN_URL = "https://cdn.115jon.site"

# ── D1 Database ──────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "kova-auth-db"
database_id = "aefbb49d-1582-4052-bd4e-77e5d559a3c6"
migrations_dir = "migrations"

# ── KV Session Cache ─────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "KV"
id = "aecb44a2caff4a65a65a6f5c8e5c375e"

# ── App Events Queue ──────────────────────────────────────────────────────────
[[queues.producers]]
binding = "APP_EVENTS"
queue = "kova-auth-app-events"

[[queues.consumers]]
queue = "kova-auth-app-events"

# ── AppCounter Durable Object ─────────────────────────────────────────────────
[[durable_objects.bindings]]
name = "APP_COUNTER"
class_name = "AppCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppCounter"]

[dev]
port = 5174

[observability.logs]
enabled = true
invocation_logs = true
