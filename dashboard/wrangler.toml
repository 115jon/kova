# ══════════════════════════════════════════════════════════════════════════════
# DEV-ONLY — Do NOT use this file for deployment or migrations.
#
# This wrangler.toml exists solely so the @cloudflare/vite-plugin can find
# worker configuration when `vite dev` is run from the dashboard/ directory.
# Paths here are relative to dashboard/.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  AUTHORITATIVE CONFIG  →  ../wrangler.toml  (repo root)                │
# │  DEPLOY COMMAND        →  pnpm run deploy  (from repo root or here)    │
# │  MIGRATE               →  pnpm run migrate:dev / migrate:prod          │
# └─────────────────────────────────────────────────────────────────────────┘
# ══════════════════════════════════════════════════════════════════════════════

name = "kova-auth-server"
main = "../server/src/index.ts"
compatibility_date = "2026-04-12"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = "dist/client"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
run_worker_first = true

[[routes]]
pattern = "auth.115jon.site"
zone_name = "115jon.site"
custom_domain = true

[[routes]]
pattern = "*.auth.115jon.site/*"
zone_name = "115jon.site"

[vars]
CDN_URL = "https://cdn.115jon.site"

[[d1_databases]]
binding = "DB"
database_name = "kova-auth-db"
database_id = "aefbb49d-1582-4052-bd4e-77e5d559a3c6"
migrations_dir = "../server/migrations"

[[kv_namespaces]]
binding = "KV"
id = "aecb44a2caff4a65a65a6f5c8e5c375e"

[[queues.producers]]
binding = "APP_EVENTS"
queue = "kova-auth-app-events"

[[durable_objects.bindings]]
name = "APP_COUNTER"
class_name = "AppCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppCounter"]

[dev]
port = 5174

[observability.logs]
enabled = true
invocation_logs = true
