# ── NOTE ─────────────────────────────────────────────────────────────────────
# The dashboard is no longer deployed as a standalone worker.
# It is bundled into the auth server via [assets] in server/wrangler.toml.
#
# Dev:    pnpm --filter dashboard dev      → Vite + Miniflare (Hono worker at :5174)
# Build:  pnpm --filter dashboard build    → emit SPA to dist/client/
# Deploy: pnpm --filter server deploy      → builds dashboard first, then deploys
#         (or: pnpm --filter dashboard deploy  → build + wrangler deploy from server/)
# ─────────────────────────────────────────────────────────────────────────────
name = "ralph-auth-server"
compatibility_date = "2026-04-12"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 5174

[observability.logs]
enabled = true
