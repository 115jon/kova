name = "ralph-auth-server"
main = "src/index.ts"
compatibility_date = "2026-04-12"
compatibility_flags = ["nodejs_compat"]

[vars]
# ── Dev defaults — override in production via: wrangler secret put <NAME> ──────
# Production AUTH_URL will be:   https://auth.115jon.site
#                           or:  https://ralph-auth.jontitor.workers.dev
AUTH_URL = "http://localhost:8787"
# Production DASHBOARD_URL will be your Cloudflare Pages URL, e.g.:
#   https://ralph-auth-dashboard.pages.dev   (or a custom domain)
DASHBOARD_URL = "http://localhost:5174"
# CDN — set as secret in production: wrangler secret put CDN_API_KEY
# Dev URL overridden in .dev.vars; prod points to deployed worker.
CDN_URL = "https://cdn.115jon.site"

# ── D1 Database ─────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "ralph-auth-db"
database_id = "aefbb49d-1582-4052-bd4e-77e5d559a3c6"

# ── KV Session Cache ─────────────────────────────────────────
[[kv_namespaces]]
binding = "KV"
id = "aecb44a2caff4a65a65a6f5c8e5c375e"


[dev]
port = 8787

[observability.logs]
enabled = true
invocation_logs = true
